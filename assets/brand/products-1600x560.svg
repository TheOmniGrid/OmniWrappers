<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Four OmniWrappers installers</title>
  <desc id="desc">A comparison of OmniDXVK, OmniDxWrapper, OmniVoodoo2 and experimental OmniVKD3D.</desc>
  <rect width="1600" height="560" fill="#020509"/>
  <text x="64" y="64" fill="#E7EBF2" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">FOUR INSTALLERS. ONE SAFETY MODEL.</text>
  <text x="64" y="94" fill="#99A3B1" font-family="Cascadia Mono,Consolas,monospace" font-size="13" letter-spacing="2">MATCH THE GAME · REVIEW THE PLAN · DEPLOY BESIDE THE EXE</text>
  <g transform="translate(64 132)" font-family="Segoe UI,Arial,sans-serif">
    <g><rect width="348" height="356" rx="4" fill="#0C1118" stroke="#303A48"/><rect width="5" height="356" fill="#8B5CF6"/><text x="28" y="48" fill="#E7EBF2" font-size="24" font-weight="700">OmniDXVK</text><text x="28" y="77" fill="#8B5CF6" font-family="Cascadia Mono,Consolas,monospace" font-size="12" letter-spacing="1.5">D3D8–11 → VULKAN</text><path d="M28 102H320" stroke="#232B36"/><text x="28" y="143" fill="#E7EBF2" font-size="16">Modern translation path for</text><text x="28" y="168" fill="#E7EBF2" font-size="16">Direct3D 8, 9, 10 and 11.</text><text x="28" y="218" fill="#99A3B1" font-size="15">• x86 and x64 payloads</text><text x="28" y="248" fill="#99A3B1" font-size="15">• companion DLL planning</text><text x="28" y="278" fill="#99A3B1" font-size="15">• exact API mapping</text><rect x="28" y="309" width="101" height="27" rx="3" fill="#171326" stroke="#6247BC"/><text x="78" y="328" fill="#C9B9FF" font-family="Cascadia Mono,Consolas,monospace" font-size="11" text-anchor="middle">X86 / X64</text></g>
    <g transform="translate(368)"><rect width="348" height="356" rx="4" fill="#0C1118" stroke="#303A48"/><rect width="5" height="356" fill="#55C8FF"/><text x="28" y="48" fill="#E7EBF2" font-size="24" font-weight="700">OmniDxWrapper</text><text x="28" y="77" fill="#55C8FF" font-family="Cascadia Mono,Consolas,monospace" font-size="12" letter-spacing="1.5">LEGACY WINDOWS APIS</text><path d="M28 102H320" stroke="#232B36"/><text x="28" y="143" fill="#E7EBF2" font-size="16">A broad compatibility layer for</text><text x="28" y="168" fill="#E7EBF2" font-size="16">older 32-bit Windows games.</text><text x="28" y="218" fill="#99A3B1" font-size="15">• 22 proxy DLL names</text><text x="28" y="248" fill="#99A3B1" font-size="15">• reviewed chain option</text><text x="28" y="278" fill="#99A3B1" font-size="15">• per-game INI settings</text><rect x="28" y="309" width="66" height="27" rx="3" fill="#0D1B22" stroke="#34738B"/><text x="61" y="328" fill="#9DE6FF" font-family="Cascadia Mono,Consolas,monospace" font-size="11" text-anchor="middle">X86</text></g>
    <g transform="translate(736)"><rect width="348" height="356" rx="4" fill="#0C1118" stroke="#303A48"/><rect width="5" height="356" fill="#22D99A"/><text x="28" y="48" fill="#E7EBF2" font-size="24" font-weight="700">OmniVoodoo2</text><text x="28" y="77" fill="#22D99A" font-family="Cascadia Mono,Consolas,monospace" font-size="12" letter-spacing="1.5">DIRECTX / GLIDE</text><path d="M28 102H320" stroke="#232B36"/><text x="28" y="143" fill="#E7EBF2" font-size="16">Guided setup for legacy DirectX</text><text x="28" y="168" fill="#E7EBF2" font-size="16">and 3Dfx Glide game paths.</text><text x="28" y="218" fill="#99A3B1" font-size="15">• official user-supplied ZIP</text><text x="28" y="248" fill="#99A3B1" font-size="15">• pinned SHA-256 check</text><text x="28" y="278" fill="#99A3B1" font-size="15">• standard / Napalm Glide 3</text><rect x="28" y="309" width="135" height="27" rx="3" fill="#0D1D19" stroke="#23785C"/><text x="95" y="328" fill="#93F4D0" font-family="Cascadia Mono,Consolas,monospace" font-size="11" text-anchor="middle">USER-SUPPLIED</text></g>
    <g transform="translate(1104)"><rect width="348" height="356" rx="4" fill="#0C1118" stroke="#303A48"/><rect width="5" height="356" fill="#F5B942"/><text x="28" y="48" fill="#E7EBF2" font-size="24" font-weight="700">OmniVKD3D</text><text x="28" y="77" fill="#F5B942" font-family="Cascadia Mono,Consolas,monospace" font-size="12" letter-spacing="1.5">D3D12 → VULKAN / EXP</text><path d="M28 102H320" stroke="#232B36"/><text x="28" y="143" fill="#E7EBF2" font-size="16">Experimental, inseparable runtime</text><text x="28" y="168" fill="#E7EBF2" font-size="16">set for Direct3D 12 games.</text><text x="28" y="218" fill="#99A3B1" font-size="15">• x86 and x64 payloads</text><text x="28" y="248" fill="#99A3B1" font-size="15">• D3D12 Core + DXGI set</text><text x="28" y="278" fill="#99A3B1" font-size="15">• explicit experimental gate</text><rect x="28" y="309" width="136" height="27" rx="3" fill="#211B0F" stroke="#86672C"/><text x="96" y="328" fill="#FFD77A" font-family="Cascadia Mono,Consolas,monospace" font-size="11" text-anchor="middle">EXPERIMENTAL</text></g>
  </g>
  <text x="64" y="530" fill="#6F7A89" font-family="Cascadia Mono,Consolas,monospace" font-size="12" letter-spacing="1.4">COMPATIBILITY VARIES BY GAME, PATCH, DRIVER AND OTHER INJECTED SOFTWARE.</text>
</svg>
