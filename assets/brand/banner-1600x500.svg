<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">OmniWrappers</title>
  <desc id="desc">Precision Hybrid banner for four private, offline and reversible Windows gaming wrapper installers.</desc>
  <rect width="1600" height="500" fill="#04080D"/>
  <g opacity=".52" stroke="#18202A" stroke-width="1">
    <path d="M0 86H1600M0 166H1600M0 246H1600M0 326H1600M0 406H1600"/>
    <path d="M100 0V500M300 0V500M500 0V500M700 0V500M900 0V500M1100 0V500M1300 0V500M1500 0V500"/>
  </g>
  <g transform="translate(80 62)">
    <text y="19" fill="#E3E8EF" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">OMNIWRAPPERS</text>
    <text y="43" fill="#969FAB" font-family="Cascadia Mono,Consolas,monospace" font-size="12" letter-spacing="3">WINDOWS GAME COMPATIBILITY / 1.0.0</text>
  </g>
  <g transform="translate(80 177)">
    <text fill="#E3E8EF" font-family="Segoe UI,Arial,sans-serif" font-size="61" font-weight="700" letter-spacing="1">CHOOSE THE GAME.</text>
    <text y="72" fill="#8A7BFF" font-family="Segoe UI,Arial,sans-serif" font-size="61" font-weight="700" letter-spacing="1">OMNI HANDLES THE WRAPPER.</text>
    <text y="125" fill="#969FAB" font-family="Segoe UI,Arial,sans-serif" font-size="20">Four focused Windows compatibility installers with architecture-aware planning,</text>
    <text y="156" fill="#969FAB" font-family="Segoe UI,Arial,sans-serif" font-size="20">safe app-local deployment, automatic backup and hash-checked rollback.</text>
  </g>
  <g transform="translate(80 411)" font-family="Cascadia Mono,Consolas,monospace" font-size="13" letter-spacing="1.2">
    <g><rect width="185" height="40" rx="3" fill="#0F141B" stroke="#30363D"/><circle cx="19" cy="20" r="4" fill="#8A7BFF"/><text x="33" y="25" fill="#E3E8EF">OmniDXVK</text></g>
    <g transform="translate(198)"><rect width="218" height="40" rx="3" fill="#0F141B" stroke="#30363D"/><circle cx="19" cy="20" r="4" fill="#57C7FF"/><text x="33" y="25" fill="#E3E8EF">OmniDxWrapper</text></g>
    <g transform="translate(429)"><rect width="205" height="40" rx="3" fill="#0F141B" stroke="#30363D"/><circle cx="19" cy="20" r="4" fill="#00C66D"/><text x="33" y="25" fill="#E3E8EF">OmniVoodoo2</text></g>
    <g transform="translate(647)"><rect width="224" height="40" rx="3" fill="#0F141B" stroke="#30363D"/><circle cx="19" cy="20" r="4" fill="#F5B942"/><text x="33" y="19" fill="#E3E8EF">OmniVKD3D</text><text x="33" y="32" fill="#F5B942" font-size="9">EXPERIMENTAL</text></g>
  </g>
  <g transform="translate(1260 76)" font-family="Cascadia Mono,Consolas,monospace">
    <rect width="260" height="320" rx="4" fill="#050910" stroke="#30363D"/>
    <text x="24" y="36" fill="#969FAB" font-size="12" letter-spacing="2">RUNTIME PROFILE</text>
    <path d="M24 54H236" stroke="#30363D"/>
    <text x="24" y="91" fill="#6A727D" font-size="12">PLATFORM</text><text x="236" y="91" fill="#E3E8EF" font-size="12" text-anchor="end">WINDOWS 10 / 11</text>
    <text x="24" y="130" fill="#6A727D" font-size="12">DEPLOYMENT</text><text x="236" y="130" fill="#E3E8EF" font-size="12" text-anchor="end">APP-LOCAL</text>
    <text x="24" y="169" fill="#6A727D" font-size="12">NETWORK</text><text x="236" y="169" fill="#00C66D" font-size="12" text-anchor="end">OFFLINE</text>
    <text x="24" y="208" fill="#6A727D" font-size="12">TELEMETRY</text><text x="236" y="208" fill="#00C66D" font-size="12" text-anchor="end">NONE</text>
    <text x="24" y="247" fill="#6A727D" font-size="12">PAYWALL</text><text x="236" y="247" fill="#00C66D" font-size="12" text-anchor="end">NONE</text>
    <path d="M24 268H236" stroke="#30363D"/>
    <circle cx="33" cy="293" r="5" fill="#00C66D"/><text x="50" y="298" fill="#E3E8EF" font-size="12" letter-spacing="1.3">PRIVATE · REVERSIBLE</text>
