<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">OmniWrappers core features</title>
  <desc id="desc">Six core features covering detection, planning, integrity, rollback, languages and privacy.</desc>
  <rect width="1600" height="520" fill="#020509"/>
  <text x="64" y="64" fill="#E7EBF2" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">SAFETY IS PART OF THE FLOW.</text>
  <text x="64" y="94" fill="#99A3B1" font-family="Cascadia Mono,Consolas,monospace" font-size="13" letter-spacing="2">SHARED ACROSS ALL FOUR INSTALLERS</text>
  <g transform="translate(64 132)" font-family="Segoe UI,Arial,sans-serif">
    <g><rect width="472" height="132" rx="4" fill="#0C1118" stroke="#232B36"/><rect width="4" height="132" fill="#8B5CF6"/><text x="26" y="38" fill="#8B5CF6" font-family="Cascadia Mono,Consolas,monospace" font-size="11" letter-spacing="1.5">ARCHITECTURE</text><text x="26" y="72" fill="#E7EBF2" font-size="20" font-weight="700">Read the executable, not the label</text><text x="26" y="103" fill="#99A3B1" font-size="15">Detect x86, x64, ARM64 or ARM64EC from PE bytes.</text></g>
    <g transform="translate(500)"><rect width="472" height="132" rx="4" fill="#0C1118" stroke="#232B36"/><rect width="4" height="132" fill="#55C8FF"/><text x="26" y="38" fill="#55C8FF" font-family="Cascadia Mono,Consolas,monospace" font-size="11" letter-spacing="1.5">EXACT MAPPING</text><text x="26" y="72" fill="#E7EBF2" font-size="20" font-weight="700">Only valid proxy DLL names</text><text x="26" y="103" fill="#99A3B1" font-size="15">Map imported APIs and required companions precisely.</text></g>
    <g transform="translate(1000)"><rect width="472" height="132" rx="4" fill="#0C1118" stroke="#232B36"/><rect width="4" height="132" fill="#22D99A"/><text x="26" y="38" fill="#22D99A" font-family="Cascadia Mono,Consolas,monospace" font-size="11" letter-spacing="1.5">INTEGRITY</text><text x="26" y="72" fill="#E7EBF2" font-size="20" font-weight="700">Hash-checked deployment plan</text><text x="26" y="103" fill="#99A3B1" font-size="15">Preview every destination before any file is written.</text></g>
    <g transform="translate(0 158)"><rect width="472" height="132" rx="4" fill="#0C1118" stroke="#232B36"/><rect width="4" height="132" fill="#F5B942"/><text x="26" y="38" fill="#F5B942" font-family="Cascadia Mono,Consolas,monospace" font-size="11" letter-spacing="1.5">RECOVERY</text><text x="26" y="72" fill="#E7EBF2" font-size="20" font-weight="700">Backup and bounded rollback</text><text x="26" y="103" fill="#99A3B1" font-size="15">Restore only files matching the recorded installation.</text></g>
    <g transform="translate(500 158)"><rect width="472" height="132" rx="4" fill="#0C1118" stroke="#232B36"/><rect width="4" height="132" fill="#8B5CF6"/><text x="26" y="38" fill="#8B5CF6" font-family="Cascadia Mono,Consolas,monospace" font-size="11" letter-spacing="1.5">ACCESSIBILITY</text><text x="26" y="72" fill="#E7EBF2" font-size="20" font-weight="700">Five live UI languages</text><text x="26" y="103" fill="#99A3B1" font-size="15">English, German, Spanish, French and Romanian.</text></g>
    <g transform="translate(1000 158)"><rect width="472" height="132" rx="4" fill="#0C1118" stroke="#232B36"/><rect width="4" height="132" fill="#55C8FF"/><text x="26" y="38" fill="#55C8FF" font-family="Cascadia Mono,Consolas,monospace" font-size="11" letter-spacing="1.5">PRIVACY</text><text x="26" y="72" fill="#E7EBF2" font-size="20" font-weight="700">Offline. No ads. No telemetry.</text><text x="26" y="103" fill="#99A3B1" font-size="15">No account, service or permanent background process.</text></g>
  </g>
  <text x="64" y="474" fill="#6F7A89" font-family="Cascadia Mono,Consolas,monospace" font-size="12" letter-spacing="1.3">THE CONSUMER UI EXCLUDES ENGINEERING LABS, BENCHMARK PANELS AND MAINTAINER COMMANDS.</text>
</svg>
